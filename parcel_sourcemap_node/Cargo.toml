[package]
authors = ["Jasper De Moor <jasperdemoor@gmail.com>"]
edition = "2021"
name = "parcel_sourcemap_node"
version = "2.1.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = {version = "3.12.1", features = ["napi4", "serde-json", "compat-mode"]}
napi-derive = "3.6.3"
parcel_sourcemap = {path = "../parcel_sourcemap"}
serde = "1"
serde_json = "1"
rkyv = "0.8.18"

[target.'cfg(target_os = "macos")'.dependencies]
jemallocator = {version = "0.5.4", features = ["disable_initial_exec_tls"]}

[build-dependencies]
napi-build = "2"
